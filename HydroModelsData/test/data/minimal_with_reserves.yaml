# Synthetic SHOP-style YAML with one reserve product (FCR_N_UP) for
# verifying the reserve-headroom code path in HydroModelsOpt. Mirrors
# minimal.yaml structurally and adds:
#   • a reserve sale-price market block (NO3_FCR_N_UP, market_type=FCR_N_UP)
#   • a `p_fcr_n_up_max: 5.0` field on the generator (offers up to 5 MW)
#   • a reserve_group with a 3 MW obligation and a penalty for shortfall

time:
  starttime: "2024-01-01 00:00:00"
  endtime: "2024-01-02 00:00:00"
  timeunit: minute
  timeresolution:
    "2024-01-01 00:00:00": 60

model:
  market:
    NO3:
      market_type: ENERGY
      sale_price:
        "2024-01-01 00:00:00": 30.0
        "2024-01-01 06:00:00": 45.0
        "2024-01-01 12:00:00": 60.0
        "2024-01-01 18:00:00": 40.0
    NO3_FCR_N_UP:
      market_type: FCR_N_UP
      sale_price:
        "2024-01-01 00:00:00": 5.0
        "2024-01-01 12:00:00": 8.0

  plant:
    DemoPlant:
      outlet_line: 100.0
      main_loss: [0.0001]
      penstock_loss: [0.0001]

  reservoir:
    upper:
      vol_head:
        x: [0.0, 50.0, 100.0]
        y: [200.0, 220.0, 240.0]
      hrl: 240.0
      lrl: 200.0
      start_vol: 50.0
      inflow:
        "2024-01-01 00:00:00": 5.0
        "2024-01-01 12:00:00": 10.0
    lower:
      vol_head:
        x: [0.0, 100.0, 200.0]
        y: [100.0, 110.0, 120.0]
      hrl: 120.0
      lrl: 100.0
      start_vol: 80.0
      inflow:
        "2024-01-01 00:00:00": 2.0

  generator:
    DemoPlant_|_G1:
      pq_curve:
        - ref: 130.0
          x: [0.0, 10.0, 50.0]
          y: [0.0, 11.0, 60.0]
      q_min: 0.0
      q_max: 50.0
      p_min: 0.0
      p_max: 60.0
      p_nom: 60.0
      penstock: 1
      p_fcr_n_up_max: 5.0

  reserve_group:
    NO3_FCR_N_UP_Group:
      # Obligations are sparse-assigned to matching timesteps (no LOCF
      # — mirrors depr's build_model semantics). Specify at every
      # timestep where the obligation should bind.
      fcr_n_up_obligation:
        "2024-01-01 00:00:00": 3.0
        "2024-01-01 06:00:00": 3.0
        "2024-01-01 12:00:00": 3.0
        "2024-01-01 18:00:00": 3.0
      fcr_n_penalty_cost:
        "2024-01-01 00:00:00": 1000.0
        "2024-01-01 06:00:00": 1000.0
        "2024-01-01 12:00:00": 1000.0
        "2024-01-01 18:00:00": 1000.0

  tunnel:
    w_upper_plant:
      q_max: 100.0
      start_height: 200.0
      end_height: 150.0
    w_plant_lower:
      q_max: 100.0
      start_height: 100.0
      end_height: 100.0
    w_upper_lower_bypass:
      q_max: 30.0
      start_height: 200.0
      end_height: 100.0
      loss_factor: 0.0

connections:
  - from: upper
    from_type: reservoir
    to: w_upper_plant
    to_type: tunnel
  - from: w_upper_plant
    from_type: tunnel
    to: DemoPlant
    to_type: plant
  - from: DemoPlant
    from_type: plant
    to: w_plant_lower
    to_type: tunnel
  - from: w_plant_lower
    from_type: tunnel
    to: lower
    to_type: reservoir
  - from: upper
    from_type: reservoir
    to: w_upper_lower_bypass
    to_type: tunnel
  - from: w_upper_lower_bypass
    from_type: tunnel
    to: lower
    to_type: reservoir
